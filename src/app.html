<!doctype html>
<html lang="%lang%" dir="%dir%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />
        <link rel="icon" type="image/png" href="/images/favicons/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/images/favicons/favicon.svg" />
        <link rel="shortcut icon" href="/images/favicons/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Rare Old" />
        <link rel="manifest" href="/images/favicons/site.webmanifest" />
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("rareold.theme");
                    var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
                    if (dark) {
                        document.documentElement.classList.add("dark");
                        document.documentElement.style.colorScheme = "dark";
                    }
                } catch (e) {}
            })();
        </script>
        <script>
            (function () {
                try {
                    var v = localStorage.getItem("rareold.view");
                    if (v === "grid" || v === "list") {
                        document.documentElement.setAttribute("data-view", v);
                        document.cookie = "rareold.view=" + v + "; path=/; samesite=lax; max-age=31536000";
                    }
                } catch (e) {}
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
